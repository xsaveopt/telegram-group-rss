<!DOCTYPE html>
<html>
<head><title>Example Channel</title></head>
<body>
<div class="tgme_header">
  <div class="tgme_channel_info">
    <div class="tgme_channel_info_header">
      <div class="tgme_channel_info_header_title"><span dir="auto">  Example Channel  </span></div>
      <div class="tgme_channel_info_header_username"><a href="https://t.me/examplechan">@examplechan</a></div>
    </div>
  </div>
</div>

<section class="tgme_channel_history js-message_history">

  <div class="tgme_widget_message_wrap js-widget_message_wrap">
    <div class="tgme_widget_message text_not_supported_wrap js-widget_message" data-post="examplechan/101">
      <div class="tgme_widget_message_user"><a href="https://t.me/examplechan"><i class="tgme_widget_message_user_photo"></i></a></div>
      <div class="tgme_widget_message_bubble">
        <a class="tgme_widget_message_owner_name" href="https://t.me/examplechan"><span dir="auto">Example Channel</span></a>
        <div class="tgme_widget_message_author accent_color"><a class="tgme_widget_message_author_name" href="https://t.me/alice"><span dir="auto">Alice</span></a></div>
        <div class="tgme_widget_message_text js-message_text" dir="auto">Hello <b>world</b></div>
        <div class="tgme_widget_message_footer compact js-message_footer">
          <div class="tgme_widget_message_info short js-message_info">
            <span class="tgme_widget_message_meta">
              <a class="tgme_widget_message_date" href="https://t.me/examplechan/101"><time datetime="2024-05-01T12:00:00+00:00" class="time">12:00</time></a>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="tgme_widget_message_wrap js-widget_message_wrap">
    <div class="tgme_widget_message service_message js-widget_message">
      <div class="tgme_widget_message_bubble">
        <div class="tgme_widget_message_text js-message_text" dir="auto">Channel created</div>
      </div>
    </div>
  </div>

  <div class="tgme_widget_message_wrap js-widget_message_wrap">
    <div class="tgme_widget_message text_not_supported_wrap js-widget_message" data-post="examplechan/102">
      <div class="tgme_widget_message_bubble">
        <div class="tgme_widget_message_author accent_color"><a class="tgme_widget_message_author_name" href="https://t.me/bob"><span dir="auto">Bob</span></a></div>
        <a class="tgme_widget_message_photo_wrap" style="width:800px;background-image:url('https://cdn.example.test/a.jpg')" href="https://t.me/examplechan/102"></a>
        <a class="tgme_widget_message_photo_wrap" style="width:800px;background-image:url(https://cdn.example.test/b.jpg)" href="https://t.me/examplechan/102"></a>
        <div class="tgme_widget_message_footer compact js-message_footer">
          <div class="tgme_widget_message_info short js-message_info">
            <span class="tgme_widget_message_meta">
              <a class="tgme_widget_message_date" href="https://t.me/examplechan/102"><time datetime="2024-05-02T09:30:00+00:00" class="time">09:30</time></a>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="tgme_widget_message_wrap js-widget_message_wrap">
    <div class="tgme_widget_message text_not_supported_wrap js-widget_message" data-post="examplechan/103">
      <div class="tgme_widget_message_bubble">
        <div class="tgme_widget_message_text" dir="auto">Fallback <i>text</i></div>
        <div class="tgme_widget_message_footer compact js-message_footer">
          <div class="tgme_widget_message_info short js-message_info">
            <span class="tgme_widget_message_meta">
              <a class="tgme_widget_message_date" href="https://t.me/examplechan/103"><time datetime="2024-05-03T00:00:00+00:00" class="time">00:00</time></a>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="tgme_widget_message_wrap js-widget_message_wrap">
    <div class="tgme_widget_message text_not_supported_wrap js-widget_message" data-post="nodelimiter">
      <div class="tgme_widget_message_bubble">
        <div class="tgme_widget_message_text js-message_text" dir="auto">Malformed post id</div>
      </div>
    </div>
  </div>

  <div class="tgme_widget_message_wrap js-widget_message_wrap">
    <div class="tgme_widget_message text_not_supported_wrap js-widget_message" data-post="examplechan/104">
      <div class="tgme_widget_message_bubble">
        <div class="tgme_widget_message_text js-message_text" dir="auto">No date here</div>
      </div>
    </div>
  </div>

  <div class="tgme_widget_message_wrap js-widget_message_wrap">
    <div class="tgme_widget_message text_not_supported_wrap js-widget_message" data-post="examplechan/105">
      <div class="tgme_widget_message_bubble">
        <div class="tgme_widget_message_text js-message_text" dir="auto">Broken date</div>
        <div class="tgme_widget_message_footer compact js-message_footer">
          <div class="tgme_widget_message_info short js-message_info">
            <span class="tgme_widget_message_meta">
              <a class="tgme_widget_message_date" href="https://t.me/examplechan/105"><time datetime="yesterday" class="time">??:??</time></a>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

</section>
</body>
</html>
